<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Track shared expenses with friends, flatmates and travel groups, and settle up with the fewest payments." />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141312" />
  <title>SettleUp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Inter:wght@400..600&display=swap"
    rel="stylesheet" />
  <script>
    // Apply the saved theme before first paint so the page doesn't flash.
    try {
      if ((localStorage.getItem('theme') || 'dark') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) { }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
